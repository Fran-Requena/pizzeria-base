# ==============================================================================
# NGINX REVERSE PROXY & SSL - PIZZERÍA BELLA NAPOLI
# ==============================================================================

# 1. Servidor HTTP (Puerto 80): Redirección automática a HTTPS + Soporte ACME Challenge
server {
    listen 80;
    server_name _;

    # Ruta para validación de certificados Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Redirección permanente (301) de todo el tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS Seguro (Puerto 443)
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL / TLS montados o generados en el arranque
    ssl_certificate /etc/ssl/certs/pizzeria.crt;
    ssl_certificate_key /etc/ssl/private/pizzeria.key;

    # Parámetros y Protocolos SSL Modernos y Seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de Seguridad Web (Security Headers)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Directorio de los archivos estáticos HTML/CSS/JS
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para alto rendimiento en despliegue
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servir archivos estáticos del Frontend Web y KDS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy hacia la API REST del backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse Proxy hacia la App Móvil PWA de Clientes
    location /app/ {
        proxy_pass http://frontend-qr-app:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Manejo de páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
