# ==============================================================================
# NGINX REVERSE PROXY - PIZZERÍA BELLA NAPOLI (CON CLOUDFLARE ZERO TRUST)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Directorio de los archivos estáticos HTML/CSS/JS del Frontend Web
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para alto rendimiento en despliegue
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cabeceras de Seguridad Web (Security Headers)
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # 1. Servir archivos estáticos del Frontend Web y KDS
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }

    # Desactivar caché estricto para assets JS y CSS en producción
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri =404;
    }


    # 2. Reverse Proxy hacia la API REST del backend (^~ evita que regex capture rutas de API)
    location ^~ /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Redirección si acceden a la App Móvil sin la barra final
    location = /app {
        return 301 /app/;
    }

    # 4. Reverse Proxy hacia la App Móvil PWA de Clientes (^~ garantiza que .js y .css vayan al contenedor QR)
    location ^~ /app/ {
        proxy_pass http://frontend-qr-app:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 5. Redirección si acceden a DbGate sin la barra final
    location = /dbgate {
        return 301 /dbgate/;
    }

    # 6. Reverse Proxy hacia DbGate (^~ garantiza que los bundles JS/CSS vayan a DbGate con WebSockets)
    location ^~ /dbgate/ {
        proxy_pass http://dbgate:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dbgate;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Manejo de páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


